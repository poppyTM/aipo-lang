[package]
name = "aipo-wasm"
description = "WebAssembly (Wasm 2.0 / WASI) binary module emitter and execution foundation for Aipo (ADP-013)"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aipo-ast = { path = "../aipo-ast" }
aipo-diagnostics = { path = "../aipo-diagnostics" }
aipo-hir = { path = "../aipo-hir" }
aipo-ir = { path = "../aipo-ir" }
aipo-lexer = { path = "../aipo-lexer" }
aipo-source = { path = "../aipo-source" }
wasm-encoder = { version = "0.261", default-features = false, features = ["std"] }
wasmprinter = "0.261"
wasmtime = { version = "49.0", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }

[features]
default = ["wasmtime"]
wasmtime = ["dep:wasmtime"]

[dev-dependencies]
aipo-syntax = { path = "../aipo-syntax" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
