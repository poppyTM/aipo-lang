[package]
name = "aipo-game-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "aipo_game_host"
path = "src/lib.rs"

[[bin]]
name = "aipo-game-host"
path = "src/main.rs"

[dependencies]
aipo-source = { path = "../aipo-source" }
aipo-diagnostics = { path = "../aipo-diagnostics" }
aipo-lexer = { path = "../aipo-lexer" }
aipo-ast = { path = "../aipo-ast" }
aipo-syntax = { path = "../aipo-syntax" }
aipo-hir = { path = "../aipo-hir" }
aipo-sema = { path = "../aipo-sema" }
aipo-ir = { path = "../aipo-ir" }
aipo-bytecode = { path = "../aipo-bytecode" }
aipo-vm = { path = "../aipo-vm" }
aipo-runtime = { path = "../aipo-runtime" }
aipo-stdlib = { path = "../aipo-stdlib" }
aipo-cli = { path = "../aipo-cli" }
aipo-egui = { path = "../aipo-egui" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
macroquad = { version = "0.4.16", features = ["audio"] }
tiny-skia = "0.11"
svgtypes = "0.16"
fontdue = "0.9"
