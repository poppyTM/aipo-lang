<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle container background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.35" />

  <!-- Background decorative circuit/branch lines -->
  <path d="M26 60 H42 L52 76 H70" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="3 3" />
  <path d="M52 76 L62 44 H94" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="3 3" />

  <!-- Core Stylized Leaf & Code Lambda / Chevron -->
  <!-- Left Leaf/Chevron -->
  <path d="M38 78 C32 64 36 44 54 36 C54 50 48 68 38 78 Z" fill="url(#leafGrad)" filter="url(#glow)" />
  
  <!-- Right Leaf/Branch (dynamic upward curve) -->
  <path d="M60 84 C62 60 76 42 90 32 C88 52 76 72 60 84 Z" fill="url(#leafGrad)" opacity="0.9" />

  <!-- Central Stem meeting Chevron Stem -->
  <path d="M42 86 C52 82 58 72 60 52 C60 40 68 32 74 26" fill="none" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Modern Accent Nodes (representing AST tokens & contracts) -->
  <circle cx="74" cy="26" r="3.5" fill="#a7f3d0" />
  <circle cx="38" cy="78" r="3" fill="#34d399" />
  <circle cx="60" cy="84" r="3.5" fill="#10b981" />
  <circle cx="90" cy="32" r="3" fill="#6ee7b7" />
</svg>
