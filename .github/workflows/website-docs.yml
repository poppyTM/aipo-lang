name: Aipo website documentation

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-docs.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-docs.yml'

jobs:
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install website dependencies
        run: npm install --no-audit --no-fund
      - name: Validate links, metadata, navigation and lesson sources
        run: npm run check
      - name: Build VitePress website
        run: npm run build
